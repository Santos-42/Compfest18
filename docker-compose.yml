services:
  backend:
    build: ./backend
    container_name: compfest18-backend
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/logistics.db
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MAX_ADDRESSES: ${MAX_ADDRESSES:-15}
      TOTAL_TIMEOUT: ${TOTAL_TIMEOUT:-30}
    volumes:
      - ./data:/app/data
      - ./ai-models:/app/ai-models
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: compfest18-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
